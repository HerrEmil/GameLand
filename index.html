<!DOCTYPE HTML>
<html lang="en-US">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="user-scalable=no">
	<meta name="description" content="Pre-alpha version of upcoming web game Game Land by Emil.">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">

	<!-- Empty inline icon: this shell has no favicon, so declare one to stop the browser requesting /favicon.ico (a spurious 404). -->
	<link rel="icon" href="data:,">

	<title>Game Land</title>

	<!-- Style Sheets -->
	<link rel="stylesheet" href="styles/main.css">
	<link rel="stylesheet" href="styles/fontfaces.css">
	<link rel="stylesheet" href="styles/mobile.css" media="screen and (max-device-width: 768px) and (orientation: portrait), screen and (max-device-width: 1024px) and (orientation: landscape)">

	<!-- iOS home screen icons -->
	<link rel="apple-touch-icon-precomposed" href="images/ios-icon.png">
	<link rel="apple-touch-icon-precomposed" sizes="72x72" href="images/ios-icon-ipad.png">
	<link rel="apple-touch-icon-precomposed" sizes="114x114" href="images/ios-icon-iphone4.png">

	<!-- iOS startup images -->
	<link rel="apple-touch-startup-image" href="images/ios-startup-748x1024.png" media="screen and (min-device-width: 768px) and (orientation:landscape)">
	<link rel="apple-touch-startup-image" href="images/ios-startup-768x1004.png" media="screen and (min-device-width: 768px) and (orientation:portrait)">
	<link rel="apple-touch-startup-image" href="images/ios-startup-320x460.png" media="screen and (max-device-width: 320px)">

	<meta name="apple-mobile-web-app-status-bar-style" content="black">

	<!-- Preload critical font and the initial screen's lazy-loaded script -->
	<link rel="preload" href="fonts/roboto-regular.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="scripts/screen.splash-screen.js" as="script">
</head>
<body>
	<div id="game">
		<!-- Loading/Splash Screen -->
		<div class="screen" id="splash-screen">
			<picture>
				<source srcset="images/logo.webp" type="image/webp">
				<img class="logo" src="images/logo.jpg" alt="Game Land logo">
			</picture><br>
			<span>(this is the loading screen)</span><br>
			<span class="continue">Click to continue</span>
		</div>

		<!-- Installation prompt displayed on iPad -->
		<div class="screen" id="install-screen">
			<picture>
				<source srcset="images/logo.webp" type="image/webp">
				<img class="logo" src="images/logo.jpg" alt="Game Land logo">
			</picture><br>
			<span>Click the <img src="images/install-icon.png" alt="Install icon"> button and Add to Home Screen to install Game Land!</span>
		</div>

		<!-- Main menu and game selection screen -->
		<div class="screen" id="main-menu">
			<span>(this is the main menu)</span><br>
			<ul id="games-menu">
				<li><button type="button" name="bear-hunt">BEAR HUNT</button></li>
				<li><button type="button" name="game2">BLOCK BREAKER</button></li>
				<li><button type="button" name="game3">CAVE FLYER</button></li>
				<li><button type="button" name="game4">TOWER STACK</button></li>
				<li><button type="button" name="snake">SNAKE</button></li>
				<li><button type="button" name="road-cross">ROAD CROSS</button></li>
				<li><button type="button" name="dash-run">DASH RUN</button></li>
				<li><button type="button" name="sky-hopper">SKY HOPPER</button></li>
				<li><button type="button" name="tile-2048">2048</button></li>
				<li><button type="button" name="star-blaster">STAR BLASTER</button></li>
			</ul>
			<div>
				<button type="button" name="help-screen" disabled title="Coming soon">HELP</button>
				<button type="button" name="high-scores">HIGH SCORES</button>
				<button type="button" name="settings-screen" disabled title="Coming soon">SETTINGS</button>
			</div>
		</div>

		<div class="screen" id="help-screen"></div>

		<div class="screen" id="high-scores"></div>

		<div class="screen" id="settings-screen"></div>

		<div class="screen" id="bear-hunt"></div>

		<div class="screen" id="game2"></div>

		<div class="screen" id="game3"></div>

		<div class="screen" id="game4"></div>

		<div class="screen" id="snake"></div>

		<div class="screen" id="road-cross"></div>

		<div class="screen" id="dash-run"></div>

		<div class="screen" id="sky-hopper"></div>

		<div class="screen" id="tile-2048"></div>

		<div class="screen" id="star-blaster"></div>
	</div>
	<script src="scripts/game.js" defer></script>
</body>
</html>
